<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>Cipher.ai</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <section class="hero-section">
        <div class="hero-container">
            <img src="assets/img/hero.png" alt="Cipher AI - A IA que está com você em todos os momentos" class="hero-img">
        </div>
    </section>

    <section class="content-section">
        <div class="card-left">
            <img src="assets/img/alone.png" alt="Se sentindo sozinho?" class="bg-card-img">
            <div class="card-left">
                <h2 class="overlay-title">Se sentindo<br><span class="sozinho">sozinho?</span></h2>
            </div>
        </div>

        <div class="card-right">
            <h2 class="section-title">Conselhos? Decisões? Planos?</h2>
            
            <form id="promptForm" class="input-box">
                <button type="button" class="btn-plus">+</button>
                <input 
                    type="text" 
                    id="promptInput" 
                    placeholder="Do que você precisa hoje?" 
                    class="prompt-input"
                    autocomplete="off"
                >
                <button type="submit" style="display: none;"></button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-left">
            <p class="phone">(11) 9444-6766</p>
            <p class="email">sac@cipher.com</p>
            <p class="brand"><a href="cipher-card.html" class="footer-cipher" data-target="cipher-card.html">Cipher</a></p>
        </div>
        <div class="footer-right">
            <span class="sparkle">✦</span>
            <span class="live-text">Live AI</span>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
